<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c26">
<title>CoopLearn</title>
<style>
:root{--ink:#18352d;--muted:#55645c;--green:#176b4a;--mint:#e5f2e9;--paper:#f5f7f3;--line:#dce4dc;--red:#a32d2d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}
header{background:#102c26;color:#fff;padding:12px 18px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-weight:750;font-size:19px}
.who{display:flex;gap:12px;align-items:center;font-size:14px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#c2c9c2;margin-right:6px}
.dot.on{background:#38a76a}.dot.off{background:#e2a73d}
nav{display:flex;gap:6px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto}
nav button{border:0;background:none;padding:10px 14px;border-radius:9px;color:var(--muted);font-weight:650;white-space:nowrap;min-height:44px;cursor:pointer}
nav button.active{background:var(--mint);color:var(--green)}
main{max-width:880px;margin:0 auto;padding:22px 16px 80px}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.item{display:flex;justify-content:space-between;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item b{display:block}
.item small{color:var(--muted);display:block;font-size:14px;white-space:pre-wrap}
.btn{border:1px solid var(--green);background:var(--green);color:#fff;border-radius:9px;padding:10px 16px;font-weight:650;min-height:44px;cursor:pointer}
.btn.ghost{background:#fff;color:var(--green)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #b9c7bd;border-radius:9px;margin:4px 0 12px;background:#fff}
input[type=checkbox]{width:auto;margin:0 8px 0 0}
label{font-weight:650;font-size:14px}
.login{max-width:400px;margin:30px auto}
.link{background:none;border:0;color:var(--green);font-weight:650;cursor:pointer;padding:8px 0}
.msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#153b2c;color:#fff;padding:12px 18px;border-radius:10px;max-width:92vw;display:none;z-index:9}
.msg.err{background:var(--red)}
.empty{color:var(--muted);margin:0}
#reader{max-width:320px;margin-bottom:12px}
:focus-visible{outline:3px solid #2f8f67;outline-offset:2px}
</style>
</head>
<body>
<header>
  <span class="brand">CoopLearn</span>
  <span class="who"><span id="api"><i class="dot"></i>Checking server</span><span id="user"></span><button class="btn ghost" id="out" hidden>Sign out</button></span>
</header>
<nav id="nav" hidden></nav>
<main id="app"></main>
<div id="msg" class="msg" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API = window.API_BASE || "http://127.0.0.1:8000";
let token = null, me = null;
try { token = sessionStorage.getItem("coop_token"); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = d => Array.isArray(d) ? d : [];
const fmt = d => d ? String(d).slice(0, 10) : "";
const today = () => new Date().toISOString().slice(0, 10);
const STAFF = ["admin", "institution", "trainer"];
const isStaff = () => me && STAFF.includes(me.role);
const isEmp = () => me && ["employer", "admin"].includes(me.role);
const isTrainee = () => me && me.role === "trainee";

const row = (title, sub, btn) => `<div class="item"><div><b>${esc(title)}</b><small>${esc(sub)}</small></div>${btn || ""}</div>`;
const F = (id, l, t = "text", x = "") => t === "check"
  ? `<label><input type="checkbox" id="${id}" ${x}>${l}</label><br><br>`
  : `<label for="${id}">${l}</label><input id="${id}" type="${t}" ${x}>`;
const V = id => { const e = $("#" + id); return e.type === "checkbox" ? e.checked : e.value.trim(); };
const post = (p, b) => api(p, {method: "POST", body: b ? JSON.stringify(b) : undefined});

let timer;
function say(text, err) {
  const m = $("#msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); m.style.display = "block";
  clearTimeout(timer); timer = setTimeout(() => m.style.display = "none", 4000);
}

async function api(path, opt = {}) {
  const headers = Object.assign({}, opt.body ? {"Content-Type": "application/json"} : {}, token ? {Authorization: "Bearer " + token} : {});
  let r;
  try { r = await fetch(API + path, Object.assign({}, opt, {headers})); }
  catch (e) { throw new Error("Cannot reach the server. Start the backend and open this page at http://localhost:5173 (not 127.0.0.1)."); }
  let d = null; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && token) { logout(); throw new Error("Session expired. Please sign in again."); }
  if (!r.ok) {
    let msg = d && typeof d.detail === "string" ? d.detail : null;
    if (!msg && r.status === 422) msg = "Some values are not valid. Please check and try again.";
    if (!msg && r.status === 403) msg = "Your account role cannot do this.";
    throw new Error(msg || "Something went wrong (" + r.status + ").");
  }
  return d;
}

function logout() {
  token = null; me = null;
  try { sessionStorage.removeItem("coop_token"); } catch (e) {}
  showLogin(false);
}

function showLogin(signup) {
  $("#nav").hidden = true; $("#out").hidden = true; $("#user").textContent = "";
  $("#app").innerHTML = `<form class="card login" id="lf"><h1>${signup ? "Create account" : "Sign in"}</h1>
    <p class="sub">${signup ? "Trainee accounts only. Staff accounts are created by an administrator." : "Use your CoopLearn account."}</p>
    ${signup ? F("fn", "Full name", "text", "required minlength=2") : ""}
    ${F("em", "Email", "email", "required autocomplete=username")}
    ${F("pw", "Password" + (signup ? " (at least 8 characters)" : ""), "password", "required minlength=8 autocomplete=" + (signup ? "new-password" : "current-password"))}
    ${signup ? F("ins", "Institution (optional)") + F("ph", "Phone (optional)", "tel") : ""}
    <button class="btn" style="width:100%">${signup ? "Create account" : "Sign in"}</button>
    <button type="button" class="link" id="sw">${signup ? "I already have an account" : "Create a trainee account"}</button></form>`;
  $("#sw").onclick = () => showLogin(!signup);
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try {
      if (signup) await post("/auth/register", {full_name: V("fn"), email: V("em"), password: $("#pw").value,
        institution: V("ins") || null, phone: V("ph") || null});
      const d = await post("/auth/login", {email: V("em"), password: $("#pw").value});
      token = d.access_token;
      try { sessionStorage.setItem("coop_token", token); } catch (x) {}
      await start();
    } catch (x) { say(x.message, true); }
  };
}

const views = {
  async programs() {
    const d = list(await api("/programs"));
    const rows = d.map(p => row(p.title,
      `${p.institution} | ${p.location} | ${fmt(p.start_date)} to ${fmt(p.end_date)} | ${p.capacity} seats${p.is_published ? "" : " | draft"}\n${p.description || ""}`,
      isTrainee() ? `<button class="btn" data-reg="${p.id}">Register</button>` : isStaff() ? `<button class="btn ghost" data-regs="${p.id}">Registrations</button>` : "")).join("");
    $("#app").innerHTML = `<h1>Programmes</h1><p class="sub">${isTrainee() ? "Register for a training programme." : "Programmes you manage."}</p>
      <div class="card">${rows || `<p class="empty">No programmes yet.</p>`}</div><div id="sub"></div>` +
      (isStaff() ? `<form class="card" id="pf"><h2>New programme</h2>${F("pt", "Title", "text", "required")}${F("pi", "Institution", "text", "required")}
        ${F("pl", "Location", "text", 'placeholder="Online"')}${F("ps", "Start date", "date", "required")}${F("pe", "End date", "date", "required")}
        ${F("pc", "Seats", "number", 'min=1 value=100')}<label for="pd">Description</label><textarea id="pd" rows="3"></textarea>
        ${F("pp", "Publish now (trainees only see published programmes)", "check")}<button class="btn">Create programme</button></form>` : "");
    if (isStaff()) $("#pf").onsubmit = async e => {
      e.preventDefault();
      try { await post("/programs", {title: V("pt"), institution: V("pi"), location: V("pl") || "Online", start_date: V("ps"), end_date: V("pe"),
        capacity: +V("pc") || 100, description: V("pd"), is_published: V("pp")}); say("Programme created."); go("programs"); }
      catch (x) { say(x.message, true); }
    };
  },
  async courses() {
    const d = list(await api("/courses"));
    $("#app").innerHTML = `<h1>Courses</h1><p class="sub">Open a course to read its lessons.</p>
      <div class="card">${d.map(c => row(c.title, `${c.language}${c.is_published ? "" : " | draft"}\n${c.description || ""}`, `<button class="btn ghost" data-les="${c.id}">Open lessons</button>`)).join("") || `<p class="empty">No courses yet.</p>`}</div><div id="sub"></div>` +
      (isStaff() ? `<form class="card" id="cf"><h2>New course</h2>${F("ct", "Title", "text", "required")}${F("cl", "Language", "text", 'value="English"')}
        <label for="cd">Description</label><textarea id="cd" rows="3"></textarea>${F("cp", "Publish now", "check")}<button class="btn">Create course</button></form>` : "");
    if (isStaff()) $("#cf").onsubmit = async e => {
      e.preventDefault();
      try { await post("/courses", {title: V("ct"), language: V("cl") || "English", description: V("cd"), is_published: V("cp")}); say("Course created."); go("courses"); }
      catch (x) { say(x.message, true); }
    };
  },
  async attendance() {
    const d = list(await api("/programs"));
    $("#app").innerHTML = `<h1>Attendance</h1><p class="sub">Mark a trainee present by typing their ID or scanning their QR code.</p>
      <form class="card" id="af"><label for="ap">Programme</label><select id="ap">${d.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join("")}</select>
      ${F("at", "Trainee ID", "number", "min=1 required")}${F("ad", "Date", "date", `value="${today()}"`)}
      <label for="am">Method</label><select id="am"><option value="manual">manual</option><option value="qr">qr</option></select>
      <button class="btn">Mark present</button> <button type="button" class="btn ghost" id="scan">Scan trainee QR</button></form>
      <div id="reader"></div><div id="sub"></div>`;
    $("#af").onsubmit = async e => {
      e.preventDefault();
      try { await post("/attendance", {program_id: +V("ap"), trainee_id: +V("at"), session_date: V("ad"), method: V("am")});
        say("Attendance marked for trainee " + V("at") + "."); records(); }
      catch (x) { say(x.message, true); }
    };
    $("#scan").onclick = () => {
      if (!window.Html5Qrcode) return say("Scanner could not load. Type the trainee ID instead.", true);
      const s = new Html5Qrcode("reader");
      s.start({facingMode: "environment"}, {fps: 8, qrbox: 220}, txt => {
        const m = /(\d+)/.exec(txt); if (!m) return;
        s.stop().catch(() => {}); $("#reader").innerHTML = "";
        $("#at").value = m[1]; $("#am").value = "qr"; $("#af").requestSubmit();
      }, () => {}).catch(() => say("Camera not available. Type the trainee ID instead.", true));
    };
    if (d.length) records();
  },
  async certs() {
    const progs = isStaff() ? list(await api("/programs")) : [];
    $("#app").innerHTML = `<h1>Certificates</h1><p class="sub">Anyone can check a certificate code.</p>
      <form class="card" id="vf"><h2>Verify a certificate</h2>${F("code", "Certificate code", "text", "required")}<button class="btn">Verify</button></form><div id="vr"></div>` +
      (isStaff() ? `<form class="card" id="if"><h2>Issue a certificate</h2><label for="ip">Programme</label><select id="ip">${progs.map(p => `<option value="${p.id}">${esc(p.title)}</option>`).join("")}</select>
        ${F("it", "Trainee ID", "number", "min=1 required")}<button class="btn">Issue certificate</button></form>` : "");
    const show = (c, title) => $("#vr").innerHTML = `<div class="card"><h2>${title}</h2>${row("Certificate code", c.certificate_code)}${row("Trainee ID", c.trainee_id)}${row("Programme ID", c.program_id)}${row("Issued on", fmt(c.issued_at))}</div>`;
    $("#vf").onsubmit = async e => {
      e.preventDefault();
      try { show(await api("/certificates/verify/" + encodeURIComponent(V("code"))), "Valid certificate"); }
      catch (x) { $("#vr").innerHTML = ""; say(x.message, true); }
    };
    if (isStaff()) $("#if").onsubmit = async e => {
      e.preventDefault();
      try { show(await post("/certificates", {trainee_id: +V("it"), program_id: +V("ip")}), "Certificate issued"); }
      catch (x) { say(x.message, true); }
    };
  },
  async jobs() {
    const d = list(await api("/jobs"));
    const mine = isTrainee() ? list(await api("/my/applications")) : [];
    $("#app").innerHTML = `<h1>Jobs</h1><p class="sub">${isTrainee() ? "Apply to openings from cooperative employers." : "Openings and applicants."}</p>
      <div class="card">${d.map(j => row(j.title, `${j.organization} | ${j.location}\n${j.description}`,
        isTrainee() ? `<button class="btn" data-apply="${j.id}">Apply</button>` : isEmp() ? `<button class="btn ghost" data-apps="${j.id}">Applicants</button>` : "")).join("") || `<p class="empty">No jobs posted yet.</p>`}</div><div id="sub"></div>` +
      (isTrainee() ? `<div class="card"><h2>My applications</h2>${mine.map(a => row("Job #" + a.job_id, `${a.status} | applied ${fmt(a.applied_at)}`)).join("") || `<p class="empty">You have not applied yet.</p>`}</div>` : "") +
      (isEmp() ? `<form class="card" id="jf"><h2>Post a job</h2>${F("jt", "Job title", "text", "required")}${F("jo", "Organisation", "text", "required")}${F("jl", "Location", "text", 'placeholder="India"')}
        <label for="jd">Description</label><textarea id="jd" rows="3" required></textarea><button class="btn">Post job</button></form>` : "");
    if (isEmp()) $("#jf").onsubmit = async e => {
      e.preventDefault();
      try { await post("/jobs", {title: V("jt"), organization: V("jo"), location: V("jl") || "India", description: V("jd")}); say("Job posted."); go("jobs"); }
      catch (x) { say(x.message, true); }
    };
  },
  async qr() {
    $("#app").innerHTML = `<h1>My attendance QR</h1><p class="sub">Show this code to your trainer when they take attendance.</p>
      <div class="card"><div id="qrbox"></div><p class="sub" style="margin:12px 0 0">Your trainee ID: <b>${esc(me.id)}</b></p></div>`;
    if (window.QRCode) new QRCode($("#qrbox"), {text: "COOP-ID:" + me.id, width: 220, height: 220});
    else $("#qrbox").textContent = "QR library could not load. Check your internet connection.";
  },
  async staff() {
    $("#app").innerHTML = `<h1>Staff accounts</h1><p class="sub">Create accounts for trusted staff and employers.</p>
      <form class="card" id="sf">${F("sn", "Full name", "text", "required minlength=2")}${F("se", "Email", "email", "required")}${F("sp", "Password (at least 8 characters)", "password", "required minlength=8")}
      <label for="sr">Role</label><select id="sr"><option>institution</option><option>trainer</option><option>employer</option><option>admin</option></select>${F("si", "Institution (optional)")}
      <button class="btn">Create account</button></form>`;
    $("#sf").onsubmit = async e => {
      e.preventDefault();
      try { await post("/auth/users", {full_name: V("sn"), email: V("se"), password: $("#sp").value, role: V("sr"), institution: V("si") || null}); say("Account created."); $("#sf").reset(); }
      catch (x) { say(x.message, true); }
    };
  }
};

async function records() {
  const d = list(await api("/attendance?program_id=" + encodeURIComponent(V("ap"))));
  $("#sub").innerHTML = `<div class="card"><h2>Attendance records</h2>${d.map(a => row("Trainee " + a.trainee_id, `${fmt(a.session_date)} | ${a.method}`)).join("") || `<p class="empty">No records for this programme yet.</p>`}</div>`;
}

async function lessons(id) {
  const d = list(await api(`/courses/${encodeURIComponent(id)}/lessons`));
  $("#sub").innerHTML = `<div class="card"><h2>Lessons</h2>${d.map(l => row(l.sort_order + ". " + l.title, l.content)).join("") || `<p class="empty">No lessons added yet.</p>`}</div>` +
    (isStaff() ? `<form class="card" id="lsf"><h2>Add a lesson</h2>${F("lt", "Title", "text", "required")}<label for="lc">Content</label><textarea id="lc" rows="4"></textarea>
      ${F("lo", "Order", "number", `min=1 value=${d.length + 1}`)}<button class="btn">Add lesson</button></form>` : "");
  if (isStaff()) $("#lsf").onsubmit = async e => {
    e.preventDefault();
    try { await post(`/courses/${encodeURIComponent(id)}/lessons`, {title: V("lt"), content: V("lc"), sort_order: +V("lo") || 1}); say("Lesson added."); lessons(id); }
    catch (x) { say(x.message, true); }
  };
}

async function go(v) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  $("#app").innerHTML = `<p class="empty">Loading...</p>`;
  try { await views[v](); } catch (x) { $("#app").innerHTML = ""; say(x.message, true); }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const D = t.dataset, id = encodeURIComponent;
  try {
    if (D.v) go(D.v);
    else if (D.reg) { await post("/programs/" + id(D.reg) + "/register"); say("You are registered for this programme."); }
    else if (D.regs) {
      const d = list(await api("/programs/" + id(D.regs) + "/registrations"));
      $("#sub").innerHTML = `<div class="card"><h2>Registrations</h2>${d.map(r => row("Trainee " + r.trainee_id, `${r.status} | ${fmt(r.registered_at)}`)).join("") || `<p class="empty">No registrations yet.</p>`}</div>`;
    }
    else if (D.apply) { await post("/jobs/" + id(D.apply) + "/apply"); say("Application sent."); go("jobs"); }
    else if (D.apps) {
      const d = list(await api("/jobs/" + id(D.apps) + "/applications"));
      $("#sub").innerHTML = `<div class="card"><h2>Applicants</h2>${d.map(a => row("Applicant " + a.applicant_id, `${a.status} | ${fmt(a.applied_at)}`)).join("") || `<p class="empty">No applicants yet.</p>`}</div>`;
    }
    else if (D.les) lessons(D.les);
  } catch (x) { say(x.message, true); }
});
$("#out").onclick = logout;

async function start() {
  try { me = await api("/auth/me"); } catch (x) { if (!token) showLogin(false); return; }
  const tabs = [["programs", "Programmes", 1], ["courses", "Courses", 1], ["attendance", "Attendance", isStaff()], ["certs", "Certificates", 1],
    ["jobs", "Jobs", 1], ["qr", "My QR", isTrainee()], ["staff", "Staff accounts", me.role === "admin"]];
  $("#nav").innerHTML = tabs.filter(t => t[2]).map(t => `<button data-v="${t[0]}">${t[1]}</button>`).join("");
  $("#nav").hidden = false; $("#out").hidden = false;
  $("#user").textContent = me.full_name + " (" + me.role + ")";
  go("programs");
}

fetch(API + "/health").then(r => r.ok ? r.json() : Promise.reject())
  .then(() => $("#api").innerHTML = '<i class="dot on"></i>Server connected')
  .catch(() => $("#api").innerHTML = '<i class="dot off"></i>Server not reachable');

if (token) start().then(() => { if (!me) showLogin(false); }); else showLogin(false);
</script>
</body>
</html>
