<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102c26">
<meta name="description" content="Cooperative training ERP, LMS and employment platform">
<link rel="manifest" href="./manifest.webmanifest">
<title>SahakarSetu · NCCT Digital Ecosystem</title>
<style>
:root{--ink:#16231e;--muted:#6b7771;--brand:#0f6b4f;--brand2:#13a36f;--mint:#eaf8f1;--paper:#f5f7f6;--surface:#fff;--line:#e5eae7;--red:#c2414a;--amber:#f2a93b;--purple:#6d5ce7;--shadow:0 12px 35px rgba(20,46,36,.08);--radius:20px}
*{box-sizing:border-box}html{scroll-behavior:smooth}[hidden]{display:none!important}
body{margin:0;min-height:100vh;overflow-x:hidden;background:var(--paper);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;grid-template:82px 1fr/250px minmax(0,1fr)}
button,input,select,textarea{font:inherit}button{transition:.2s ease}button:active{transform:translateY(1px)}
header{grid-column:1/-1;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:0 28px;display:flex;gap:18px;align-items:center;justify-content:space-between;z-index:5;position:sticky;top:0}
.brand{display:flex;align-items:center;gap:12px}.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#0ab981);display:grid;place-items:center;color:white;box-shadow:0 8px 20px rgba(15,107,79,.24)}
.brandmark svg{width:25px;height:25px}.brandtext{display:flex;flex-direction:column;line-height:1.15}.brandtext b{font-size:18px;letter-spacing:-.3px}.brandtext small{color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.3px;text-transform:uppercase}
.who{display:flex;gap:12px;align-items:center;font-size:13px;flex-wrap:wrap}.status-chip{padding:8px 11px;border:1px solid var(--line);background:#fafcfb;border-radius:999px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#c2c9c2;margin-right:7px;box-shadow:0 0 0 3px rgba(194,201,194,.18)}.dot.on{background:#22b573;box-shadow:0 0 0 3px rgba(34,181,115,.14)}.dot.off{background:var(--amber)}
nav{grid-column:1;grid-row:2;background:#10271f;color:#fff;padding:24px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:5px;position:sticky;top:82px;height:calc(100vh - 82px);scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav:before{content:"WORKSPACE";font-size:10px;letter-spacing:1.7px;color:#77988a;font-weight:800;padding:0 13px 10px}
nav button{border:0;background:transparent;padding:11px 13px;border-radius:12px;color:#a9beb5;font-weight:650;text-align:left;white-space:nowrap;min-height:45px;cursor:pointer;display:flex;align-items:center;gap:11px}
nav button:hover{background:rgba(255,255,255,.055);color:#fff}nav button.active{background:linear-gradient(100deg,rgba(35,191,133,.2),rgba(35,191,133,.08));color:#fff;box-shadow:inset 3px 0 #30d192}.navicon{font-size:17px;width:20px;text-align:center;filter:saturate(.8)}
main{grid-column:2;grid-row:2;width:100%;max-width:1280px;margin:0 auto;padding:34px 38px 90px}
h1{font-size:30px;line-height:1.15;letter-spacing:-.9px;margin:0 0 7px}h2{font-size:18px;letter-spacing:-.25px;margin:0 0 13px}h3{margin:0 0 6px}.sub{color:var(--muted);margin:0 0 22px}
.card{background:var(--surface);border:1px solid rgba(222,229,225,.9);border-radius:var(--radius);padding:21px;margin-bottom:17px;box-shadow:0 3px 15px rgba(25,55,43,.035)}
.card:hover{border-color:#d8e3dd}.item{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:16px 2px;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.item b{display:block;font-size:15px}.item small{color:var(--muted);display:block;font-size:13px;white-space:pre-wrap;margin-top:3px}
.btn{border:1px solid var(--brand);background:linear-gradient(135deg,var(--brand),#118d64);color:#fff;border-radius:11px;padding:9px 15px;font-weight:700;min-height:41px;cursor:pointer;box-shadow:0 4px 12px rgba(15,107,79,.14)}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.ghost{background:#fff;color:var(--brand);border-color:#cfddd6;box-shadow:none}.btn.ghost:hover{background:var(--mint)}
input,select,textarea{width:100%;padding:12px 13px;border:1px solid #d4ddd8;border-radius:11px;margin:5px 0 15px;background:#fafcfb;color:var(--ink);transition:.2s}input:hover,select:hover,textarea:hover{border-color:#adc5b9}input:focus,select:focus,textarea:focus{outline:0;border-color:#2a9b72;box-shadow:0 0 0 4px rgba(42,155,114,.11);background:#fff}input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0}label{font-weight:700;font-size:13px;color:#30453b}
.auth-mode{display:block;background:#edf5f1}.auth-mode header{position:fixed;width:100%;background:transparent;border:0}.auth-mode main{max-width:none;padding:0;min-height:100vh}.auth-shell{min-height:100vh;display:grid;grid-template-columns:minmax(360px,.9fr) 1.1fr}.auth-panel{display:grid;place-items:center;padding:110px 36px 50px}.login{width:100%;max-width:440px;margin:0;padding:30px;box-shadow:var(--shadow)}.auth-visual{position:relative;overflow:hidden;background:linear-gradient(135deg,#0b3f31,#0b7652 65%,#14a571);color:#fff;padding:12vh 8vw;display:flex;flex-direction:column;justify-content:flex-end}.auth-visual:before,.hero:before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;border:80px solid rgba(255,255,255,.055);right:-110px;top:-100px}.auth-visual h2{font-size:42px;line-height:1.12;max-width:620px;letter-spacing:-1.5px}.auth-visual p{max-width:550px;color:#cde8dc;font-size:17px}.auth-badges{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.auth-badges span{padding:8px 12px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.08);font-size:12px}
.link{background:none;border:0;color:var(--brand);font-weight:750;cursor:pointer;padding:12px 0}.msg{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#153b2c;color:#fff;padding:13px 19px;border-radius:12px;max-width:92vw;display:none;z-index:20;box-shadow:var(--shadow)}.msg.err{background:var(--red)}
.hero{position:relative;overflow:hidden;border:0;border-radius:26px;background:linear-gradient(125deg,#0c563f,#0c8159);color:#fff;padding:34px 36px;margin-bottom:22px;box-shadow:0 18px 45px rgba(11,102,73,.18)}.hero>*{position:relative}.hero h1{font-size:34px;max-width:680px}.hero p{color:#d5eee3;max-width:650px;margin-bottom:21px}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:800;color:#8ee0bd;margin-bottom:10px}.hero-actions{display:flex;gap:10px;flex-wrap:wrap}.hero .btn{background:#fff;color:#0b6b4b;border-color:#fff}.hero .btn.ghost{background:rgba(255,255,255,.09);color:#fff;border-color:rgba(255,255,255,.3)}
.empty{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:15px;margin-bottom:20px}.grid .card{margin:0}.metric{font-size:31px;font-weight:800;letter-spacing:-1px;color:var(--brand)}.metric-card{position:relative;overflow:hidden}.metric-card small{color:var(--muted);font-weight:650}.metric-icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--mint);margin-bottom:15px;font-size:18px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:26px 0 12px}.section-head h2{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{display:inline-block;padding:4px 9px;border-radius:999px;background:var(--mint);color:var(--brand);font-size:11px;font-weight:800;text-transform:capitalize}.warn{border-left:4px solid var(--amber)}.ok{border-left:4px solid var(--brand2)}.question{padding:16px 0;border-top:1px solid var(--line)}.question:first-child{border-top:0}.question label{display:block;font-weight:500;margin:9px 0}.question input{width:auto;margin-right:8px}#reader{max-width:340px;margin:14px 0;border-radius:16px;overflow:hidden}
.progress{height:9px;background:#edf1ef;border-radius:99px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--brand),#22c98a)}.score{min-width:54px;height:54px;border-radius:16px;background:var(--mint);display:grid;place-items:center;color:var(--brand);font-weight:850}.risk-high{border-left:4px solid var(--red)}.risk-medium{border-left:4px solid var(--amber)}.mono{font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;background:#10271f;color:#b9f3d9;border-radius:10px;padding:12px;word-break:break-all}
.feature-card{min-height:170px}.feature-card .metric-icon{font-size:20px}.feature-card p{color:var(--muted);margin:5px 0 0}.journey{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin-bottom:22px}.journey-step{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 14px;min-height:126px}.journey-step b{display:block;margin:8px 0 4px}.journey-step small{color:var(--muted)}.stepno{width:27px;height:27px;border-radius:9px;background:var(--mint);color:var(--brand);font-weight:850;display:grid;place-items:center}.solution-footer{text-align:center;color:var(--muted);font-size:12px;padding:28px 10px 0}.solution-footer b{color:var(--brand)}.callout{background:linear-gradient(120deg,#eefaf4,#f6fbf8);border-color:#d9eee4}.quote{font-size:20px;line-height:1.5;letter-spacing:-.25px;color:#25483a}
:focus-visible{outline:3px solid #43b88d;outline-offset:2px}
@media(max-width:900px){body{grid-template:72px 1fr/1fr}header{grid-row:1;padding:0 16px}.brandtext small{display:none}nav{grid-column:1;grid-row:2;position:fixed;left:0;right:0;bottom:0;top:auto;height:68px;z-index:10;flex-direction:row;overflow-x:auto;padding:8px 10px;background:#10271f}nav:before{display:none}nav button{min-width:76px;flex-direction:column;justify-content:center;gap:1px;font-size:10px;padding:5px 9px}nav button.active{box-shadow:inset 0 3px #30d192}main{grid-column:1;grid-row:2;padding:25px 16px 92px}.status-chip{display:none}.auth-shell{grid-template-columns:1fr}.auth-visual{display:none}.auth-panel{padding:95px 18px 35px}.hero{padding:28px 24px}.hero h1{font-size:28px}.journey{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.who #user{display:none}.item{align-items:flex-start;flex-direction:column}.actions{justify-content:flex-start;width:100%}.actions .btn{flex:1}.grid{grid-template-columns:1fr 1fr;gap:10px}.card{padding:17px;border-radius:16px}.metric{font-size:25px}h1{font-size:26px}.journey{grid-template-columns:1fr 1fr}.feature-card{min-height:auto}}
</style>
</head>
<body>
<header>
  <span class="brand"><span class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 11.5 12 5l8 6.5v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M8 19.5v-6h8v6M9 9.5h6"/></svg></span><span class="brandtext"><b>SahakarSetu</b><small>NCCT Digital Ecosystem</small></span></span>
  <span class="who"><span id="api" class="status-chip"><i class="dot"></i>Checking server</span><span id="user"></span><button class="btn ghost" id="out" hidden>Sign out</button></span>
</header>
<nav id="nav" hidden></nav>
<main id="app"></main>
<div id="msg" class="msg" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API = window.API_BASE || (location.protocol.startsWith("http") ? location.origin : "http://127.0.0.1:8000");
let token = null, me = null;
try { token = sessionStorage.getItem("coop_token"); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const list = d => Array.isArray(d) ? d : [];
const fmt = d => d ? String(d).slice(0, 10) : "";
const today = () => new Date().toISOString().slice(0, 10);
const STAFF = ["admin", "institution", "trainer"];
const isStaff = () => me && STAFF.includes(me.role);
const isEmp = () => me && ["employer", "admin"].includes(me.role);
const isTrainee = () => me && me.role === "trainee";

const row = (title, sub, btn) => `<div class="item"><div><b>${esc(title)}</b><small>${esc(sub)}</small></div>${btn || ""}</div>`;
const F = (id, l, t = "text", x = "") => t === "check"
  ? `<label><input type="checkbox" id="${id}" ${x}>${l}</label><br><br>`
  : `<label for="${id}">${l}</label><input id="${id}" type="${t}" ${x}>`;
const V = id => { const e = $("#" + id); return e.type === "checkbox" ? e.checked : e.value.trim(); };
const post = (p, b) => api(p, {method: "POST", body: b ? JSON.stringify(b) : undefined});
const put = (p, b) => api(p, {method: "PUT", body: JSON.stringify(b)});
const patch = (p, b) => api(p, {method: "PATCH", body: JSON.stringify(b)});

let timer;
function say(text, err) {
  const m = $("#msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); m.style.display = "block";
  clearTimeout(timer); timer = setTimeout(() => m.style.display = "none", 4000);
}

async function api(path, opt = {}) {
  const headers = Object.assign({}, opt.body ? {"Content-Type": "application/json"} : {}, token ? {Authorization: "Bearer " + token} : {});
  const method = opt.method || "GET";
  const cacheable = method === "GET" && (!me || isTrainee()) && (/^\/courses(?:\/|$)/.test(path) || /^\/assessments\/\d+\/questions/.test(path) || /^\/programs(?:\/\d+\/timetable)?$/.test(path));
  const cacheKey = "coop_cache:" + path;
  let r;
  try { r = await fetch(API + path, Object.assign({}, opt, {headers})); }
  catch (e) {
    if (cacheable) { try { const saved=localStorage.getItem(cacheKey); if (saved) return JSON.parse(saved); } catch (ignore) {} }
    const x = new Error("Cannot reach the server. Your pending lesson progress will sync when you reconnect."); x.network = true; throw x;
  }
  let d = null; try { d = await r.json(); } catch (e) {}
  if (r.status === 401 && token) { logout(); throw new Error("Session expired. Please sign in again."); }
  if (!r.ok) {
    let msg = d && typeof d.detail === "string" ? d.detail : null;
    if (!msg && r.status === 422) msg = "Some values are not valid. Please check and try again.";
    if (!msg && r.status === 403) msg = "Your account role cannot do this.";
    const x = new Error(msg || "Something went wrong (" + r.status + ")."); x.status = r.status; throw x;
  }
  if (cacheable) try { localStorage.setItem(cacheKey,JSON.stringify(d)); } catch (ignore) {}
  return d;
}

function logout() {
  token = null; me = null;
  try { sessionStorage.removeItem("coop_token"); sessionStorage.removeItem("coop_me"); } catch (e) {}
  showLogin(false);
}

function showLogin(signup) {
  document.body.classList.add("auth-mode");
  $("#nav").hidden = true; $("#out").hidden = true; $("#user").textContent = "";
  $("#app").innerHTML = `<div class="auth-shell"><section class="auth-panel"><form class="card login" id="lf"><div class="eyebrow">Welcome to SahakarSetu</div><h1>${signup ? "Create your learner account" : "Sign in to your workspace"}</h1>
    <p class="sub">${signup ? "Join India's cooperative learning and employment network." : "Learning, operations and opportunity—connected in one place."}</p>
    ${signup ? F("fn", "Full name", "text", "required minlength=2") : ""}
    ${F("em", "Email", "email", "required autocomplete=username")}
    ${F("pw", "Password" + (signup ? " (at least 8 characters)" : ""), "password", "required minlength=8 autocomplete=" + (signup ? "new-password" : "current-password"))}
    ${signup ? F("ins", "Institution (optional)") + F("ph", "Phone (optional)", "tel") : ""}
    <button class="btn" style="width:100%">${signup ? "Create account" : "Sign in securely"}</button>
    <button type="button" class="link" id="sw">${signup ? "I already have an account" : "New learner? Create an account"}</button></form></section>
    <section class="auth-visual"><div class="eyebrow">Ministry of Cooperation · NCCT</div><h2>Building skills. Strengthening cooperatives. Creating livelihoods.</h2>
    <p>A unified platform for training institutions, cooperative personnel, rural youth, educators and employers across India.</p>
    <div class="auth-badges"><span>Multilingual LMS</span><span>Verified credentials</span><span>Employment exchange</span><span>Offline ready</span></div></section></div>`;
  $("#sw").onclick = () => showLogin(!signup);
  $("#lf").onsubmit = async e => {
    e.preventDefault();
    try {
      if (signup) await post("/auth/register", {full_name: V("fn"), email: V("em"), password: $("#pw").value,
        institution: V("ins") || null, phone: V("ph") || null});
      const d = await post("/auth/login", {email: V("em"), password: $("#pw").value});
      token = d.access_token;
      try { sessionStorage.setItem("coop_token", token); } catch (x) {}
      await start();
    } catch (x) { say(x.message, true); }
  };
}

const views = {
  async home() {
    const [programs,courses,jobs] = await Promise.all([api("/programs").catch(()=>[]),api("/courses").catch(()=>[]),api("/jobs").catch(()=>[])]);
    let stats={programs:list(programs).length,courses:list(courses).length,jobs:list(jobs).length,registrations:"—"};
    if (["admin","institution"].includes(me.role)) try { const a=await api("/analytics/overview");stats={programs:a.programs,courses:a.courses,jobs:a.active_jobs,registrations:a.registrations}; } catch(e){}
    const first=(me.full_name||"there").split(" ")[0];
    const employerOnly=me.role==="employer";
    const roleCopy=isTrainee()?"Continue learning, build verified skills and discover opportunities made for your journey.":employerOnly?"Connect trained cooperative talent with meaningful livelihood opportunities.":"Manage training operations and turn programme data into measurable impact.";
    $("#app").innerHTML=`<section class="hero"><div class="eyebrow">Your cooperative growth workspace</div><h1>Namaste, ${esc(first)}. Ready to create impact?</h1><p>${roleCopy}</p><div class="hero-actions">
      <button class="btn" data-v="${isTrainee()?"courses":employerOnly?"jobs":"programs"}">${isTrainee()?"Continue learning":employerOnly?"Manage opportunities":"Manage programmes"}</button>
      <button class="btn ghost" data-v="${isTrainee()?"career":["admin","institution"].includes(me.role)?"analytics":"operations"}">${isTrainee()?"Ask career guide":["admin","institution"].includes(me.role)?"View analytics":"Open operations"}</button></div></section>
      <div class="grid"><div class="card metric-card"><div class="metric-icon">◫</div><div class="metric">${stats.programs}</div><small>Training programmes</small></div>
      <div class="card metric-card"><div class="metric-icon">▤</div><div class="metric">${stats.courses}</div><small>Learning courses</small></div>
      <div class="card metric-card"><div class="metric-icon">⌁</div><div class="metric">${stats.jobs}</div><small>Active opportunities</small></div>
      <div class="card metric-card"><div class="metric-icon">✓</div><div class="metric">${stats.registrations}</div><small>Total registrations</small></div></div>
      <div class="section-head"><div><div class="eyebrow">Discover</div><h2>Upcoming programmes</h2></div><button class="btn ghost" data-v="programs">View all</button></div>
      <div class="card">${list(programs).slice(0,4).map(p=>row(p.title,`${p.institution} · ${p.location} · ${fmt(p.start_date)}`,`<span class="pill">${p.is_published?"Open":"Draft"}</span>`)).join("")||`<p class="empty">No programmes have been published yet.</p>`}</div>
      <div class="section-head"><div><div class="eyebrow">One connected ecosystem</div><h2>From training need to livelihood outcome</h2></div><button class="btn ghost" data-v="about">See the vision</button></div>
      <div class="journey">${[["1","Discover","Relevant programme"],["2","Learn","Online + offline"],["3","Validate","Assessment"],["4","Verify","Digital credential"],["5","Match","AI opportunity fit"],["6","Progress","Employment outcome"]].map(x=>`<div class="journey-step"><span class="stepno">${x[0]}</span><b>${x[1]}</b><small>${x[2]}</small></div>`).join("")}</div>
      <div class="solution-footer"><b>SahakarSetu</b> · Designed for NCCT, VAMNICOM, RICMs, ICMs and India's cooperative community</div>`;
  },
  async about() {
    $("#app").innerHTML=`<div class="eyebrow">SIH 26087 · Ministry of Cooperation</div><h1>A digital bridge from capacity building to employment</h1>
      <p class="sub">SahakarSetu unifies fragmented training administration, learning, verified skills and livelihood access for cooperative stakeholders and rural youth.</p>
      <div class="card callout"><div class="quote">“Every learner should remain visible—from first registration to verified skill, meaningful opportunity and measurable outcome.”</div></div>
      <div class="section-head"><div><div class="eyebrow">The challenge</div><h2>Why this platform matters</h2></div></div>
      <div class="grid"><div class="card feature-card"><div class="metric-icon">⌁</div><h2>Fragmented records</h2><p>Manual and disconnected systems make participant history, outreach and programme outcomes difficult to track.</p></div>
      <div class="card feature-card"><div class="metric-icon">◌</div><h2>Unequal access</h2><p>Rural learners need multilingual, mobile-friendly and offline-capable learning that works beyond reliable broadband.</p></div>
      <div class="card feature-card"><div class="metric-icon">◇</div><h2>Skills without visibility</h2><p>Certificates and practical capability often remain disconnected from employers, career support and livelihood pathways.</p></div></div>
      <div class="section-head"><div><div class="eyebrow">The SahakarSetu model</div><h2>Built for measurable cooperative impact</h2></div></div>
      <div class="grid"><div class="card feature-card"><div class="metric-icon">✣</div><h2>Explainable AI</h2><p>Transparent course and job matching, next-best actions and human-reviewed learner-risk signals—without automated exclusion.</p></div>
      <div class="card feature-card"><div class="metric-icon">▣</div><h2>Inclusive attendance</h2><p>Secure QR and hardware-ready face terminals with explicit consent, confidence thresholds, audit events and a non-biometric alternative.</p></div>
      <div class="card feature-card"><div class="metric-icon">▤</div><h2>End-to-end ERP + LMS</h2><p>Programmes, nominations, timetable, hostel, logistics, learning, assessments, credentials, analytics and employment in one workflow.</p></div>
      <div class="card feature-card"><div class="metric-icon">◫</div><h2>National monitoring</h2><p>Role-aware indicators help NCCT and institutions understand participation, learning, certification and employment conversion.</p></div></div>
      <div class="card ok"><h2>Privacy, inclusion and trust</h2><p class="sub" style="margin:0">Biometric consent is explicit. QR remains available. AI recommendations include reasons. Risk scores trigger supportive outreach only. Employers cannot see data outside their authorized pipeline.</p></div>

  const done = new Map(list(progress.items).map(p => [p.lesson_id,p]));
  $("#sub").innerHTML = `<div class="card"><h2>Lessons ${isTrainee() ? `· ${progress.completion_percentage}% complete` : ""}</h2>${d.map(l => row(l.sort_order + ". " + l.title, l.content,
    isTrainee() ? `<button class="btn ${done.get(l.id)?.completed ? "ghost" : ""}" data-progress="${l.id}" data-course="${id}">${done.get(l.id)?.completed ? "Completed" : "Mark complete"}</button>` : "")).join("") || `<p class="empty">No lessons added yet.</p>`}</div>` +
    (isStaff() ? `<form class="card" id="lsf"><h2>Add a lesson</h2>${F("lt", "Title", "text", "required")}<label for="lc">Content</label><textarea id="lc" rows="4"></textarea>
      ${F("lo", "Order", "number", `min=1 value=${d.length + 1}`)}<button class="btn">Add lesson</button></form>` : "");
  if (isStaff()) $("#lsf").onsubmit = async e => {
    e.preventDefault();
    try { await post(`/courses/${encodeURIComponent(id)}/lessons`, {title: V("lt"), content: V("lc"), sort_order: +V("lo") || 1}); say("Lesson added."); lessons(id); }
    catch (x) { say(x.message, true); }
  };
}

async function assessments(courseId) {
  const d = list(await api(`/courses/${encodeURIComponent(courseId)}/assessments`));
  let attempts = [];
  if (isTrainee()) attempts = list(await api("/my/assessment-attempts").catch(() => []));
  const latest = new Map(); attempts.forEach(a => { if (!latest.has(a.assessment_id)) latest.set(a.assessment_id,a); });
  $("#sub").innerHTML = `<div class="card"><h2>Assessments</h2>${d.map(a => row(a.title, `${a.question_count} questions | pass mark ${a.passing_percentage}% | ${a.max_attempts} attempts${latest.has(a.id) ? ` | latest ${latest.get(a.id).score}%` : ""}`,
    isTrainee() ? `<button class="btn" data-take="${a.id}">Take assessment</button>` : `<button class="btn ghost" data-attempts="${a.id}">Results</button>`)).join("") || `<p class="empty">No assessments available.</p>`}</div>` +
    (isStaff() ? `<form class="card" id="asf"><h2>Create assessment</h2>${F("ast","Title","text","required")}${F("asp","Passing percentage","number","min=0 max=100 value=60")}${F("asm","Maximum attempts","number","min=1 max=20 value=3")}
    <label for="asq">Questions JSON</label><textarea id="asq" rows="7" required>[{"prompt":"Example question","options":["Option A","Option B"],"correct_option":0}]</textarea>
    ${F("aspub","Publish now","check")}<button class="btn">Create assessment</button></form>` : "");
  if ($("#asf")) $("#asf").onsubmit = async e => {e.preventDefault();try{const questions=JSON.parse(V("asq"));if(!Array.isArray(questions)||!questions.length)throw new Error("Questions must be a non-empty JSON array.");
    await post(`/courses/${encodeURIComponent(courseId)}/assessments`,{title:V("ast"),questions,passing_percentage:+V("asp"),max_attempts:+V("asm"),is_published:V("aspub")});say("Assessment created.");assessments(courseId);}catch(x){say(x.message,true)}};
}

async function takeAssessment(id) {
  const d = await api(`/assessments/${encodeURIComponent(id)}/questions`);
  $("#sub").innerHTML = `<form class="card" id="takef"><h2>${esc(d.title)}</h2>${list(d.questions).map((q,i)=>`<div class="question"><b>${i+1}. ${esc(q.prompt)}</b>${list(q.options).map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}" required>${esc(o)}</label>`).join("")}</div>`).join("")}<button class="btn">Submit assessment</button></form>`;
  $("#takef").onsubmit = async e => {e.preventDefault();const answers=list(d.questions).map((_,i)=>+new FormData(e.target).get(`q${i}`));try{const r=await post(`/assessments/${encodeURIComponent(id)}/attempts`,{answers});
    $("#sub").innerHTML=`<div class="card ${r.passed?"ok":"warn"}"><h2>${r.passed?"Passed":"Keep learning"}</h2><div class="metric">${r.score}%</div><p>${r.passed?"Assessment completed successfully.":"Review the lessons and try again if attempts remain."}</p></div>`;}catch(x){say(x.message,true)}};
}

async function schedule(programId) {
  const d = list(await api(`/programs/${encodeURIComponent(programId)}/timetable`));
  $("#sub").innerHTML = `<div class="card"><h2>Timetable</h2>${d.map(s=>row(`${fmt(s.session_date)} · ${String(s.start_time).slice(0,5)}–${String(s.end_time).slice(0,5)}`,`${s.topic} | ${s.trainer_name||"Trainer TBA"} | ${s.venue||"Venue TBA"}`)).join("")||`<p class="empty">No sessions scheduled.</p>`}</div>`+
    (isStaff()?`<form class="card" id="schedf"><h2>Add session</h2>${F("schd","Date","date","required")}${F("schs","Start","time","required")}${F("sche","End","time","required")}${F("scht","Topic","text","required")}${F("schtr","Trainer")}${F("schv","Venue")}<button class="btn">Add session</button></form>`:"");
  if ($("#schedf")) $("#schedf").onsubmit=async e=>{e.preventDefault();try{await post(`/programs/${encodeURIComponent(programId)}/timetable`,{session_date:V("schd"),start_time:V("schs"),end_time:V("sche"),topic:V("scht"),trainer_name:V("schtr"),venue:V("schv")});say("Session added.");schedule(programId);}catch(x){say(x.message,true)}};
}

async function manageRegistrations(programId) {
  const [regs,noms] = await Promise.all([api(`/programs/${encodeURIComponent(programId)}/registrations`),api(`/programs/${encodeURIComponent(programId)}/nominations`)]);
  $("#sub").innerHTML = `<div class="card"><h2>Registrations</h2>${list(regs).map(r=>row(`Trainee ${r.trainee_id}`,`${r.status} | ${fmt(r.registered_at)}`,`<span class="actions">${["approved","rejected","cancelled"].map(s=>`<button class="btn ghost" data-regstatus="${r.id}" data-status="${s}" data-program="${programId}">${s}</button>`).join("")}</span>`)).join("")||`<p class="empty">No registrations.</p>`}</div>
    <div class="card"><h2>Nominations</h2>${list(noms).map(n=>row(n.trainee_name,`${n.trainee_email} | ${n.status}`)).join("")||`<p class="empty">No nominations.</p>`}</div>
    <form class="card" id="nomf"><h2>Nominate participant</h2>${F("nomn","Name","text","required")}${F("nome","Email","email","required")}<button class="btn">Nominate</button></form>`;
  $("#nomf").onsubmit=async e=>{e.preventDefault();try{await post(`/programs/${encodeURIComponent(programId)}/nominations`,{trainee_name:V("nomn"),trainee_email:V("nome")});say("Participant nominated.");manageRegistrations(programId);}catch(x){say(x.message,true)}};
}

async function showAttempts(assessmentId) {
  const d=list(await api(`/assessments/${encodeURIComponent(assessmentId)}/attempts`));
  $("#sub").innerHTML=`<div class="card"><h2>Assessment results</h2>${d.map(a=>row(`Trainee ${a.trainee_id}`,`${a.score}% | ${a.passed?"passed":"not passed"} | ${fmt(a.submitted_at)}`)).join("")||`<p class="empty">No attempts yet.</p>`}</div>`;
}

const QUEUE_KEY = "coop_offline_progress";
function queuedProgress() { try { return JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]"); } catch (e) { return []; } }
function queueProgress(item) {
  const q=queuedProgress().filter(x=>x.lesson_id!==item.lesson_id);q.push(item);
  try { localStorage.setItem(QUEUE_KEY,JSON.stringify(q)); } catch (e) {}
}
async function flushProgress() {
  const q=queuedProgress(); if (!q.length || !token || !navigator.onLine) return;
  try { const r=await post("/offline/sync",{progress:q});
    const conflicts=new Set(list(r.conflicts).map(x=>x.lesson_id));
    localStorage.setItem(QUEUE_KEY,JSON.stringify(q.filter(x=>conflicts.has(x.lesson_id))));
    if (r.accepted) say(`${r.accepted} offline progress update${r.accepted===1?"":"s"} synced.`);
  } catch (x) {}
}
async function saveLessonProgress(lessonId,courseId) {
  const item={lesson_id:+lessonId,completed:true,last_position_seconds:0,client_updated_at:new Date().toISOString()};
  try { await put(`/lessons/${encodeURIComponent(lessonId)}/progress`,{completed:true,last_position_seconds:0});say("Lesson marked complete.");lessons(courseId); }
  catch (x) { if (!x.network) return say(x.message,true);queueProgress(item);say("Saved offline. Progress will sync when you reconnect."); }
}

async function go(v) {
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("active", b.dataset.v === v));
  $("#app").innerHTML = `<p class="empty">Loading...</p>`;
  try { await views[v](); } catch (x) { $("#app").innerHTML = ""; say(x.message, true); }
}

document.addEventListener("click", async e => {
  const t = e.target.closest("button"); if (!t) return;
  const D = t.dataset, id = encodeURIComponent;
  try {
    if (D.v) go(D.v);
    else if (D.reg) { await post("/programs/" + id(D.reg) + "/register"); say("You are registered for this programme."); }
    else if (D.regs) manageRegistrations(D.regs);
    else if (D.regstatus) { await patch(`/registrations/${id(D.regstatus)}`,{status:D.status});say("Registration updated.");manageRegistrations(D.program); }
    else if (D.schedule) schedule(D.schedule);
    else if (D.enroll) { await post(`/courses/${id(D.enroll)}/enroll`);say("Course enrollment complete.");go("courses"); }
    else if (D.apply) { await post("/jobs/" + id(D.apply) + "/apply"); say("Application sent."); go("jobs"); }
    else if (D.apps) {
      const d = list(await api("/jobs/" + id(D.apps) + "/applications"));
      $("#sub").innerHTML = `<div class="card"><h2>Applicants</h2>${d.map(a => row("Applicant " + a.applicant_id, `${a.status} | ${fmt(a.applied_at)}`,`<span class="actions">${["shortlisted","interview","selected","rejected"].map(s=>`<button class="btn ghost" data-appstatus="${a.id}" data-status="${s}" data-job="${D.apps}">${s}</button>`).join("")}</span>`)).join("") || `<p class="empty">No applicants yet.</p>`}</div>`;
    }
    else if (D.appstatus) { await patch(`/job-applications/${id(D.appstatus)}`,{status:D.status});say("Application updated.");document.querySelector(`[data-apps="${D.job}"]`)?.click(); }
    else if (D.logstatus) { await patch(`/logistics/${id(D.logstatus)}`,{status:D.status});say("Logistics request updated.");go("operations"); }
    else if (D.les) lessons(D.les);
    else if (D.assess) assessments(D.assess);
    else if (D.take) takeAssessment(D.take);
    else if (D.attempts) showAttempts(D.attempts);
    else if (D.progress) saveLessonProgress(D.progress,D.course);
  } catch (x) { say(x.message, true); }
});
$("#out").onclick = logout;

async function start() {
  try { me = await api("/auth/me"); sessionStorage.setItem("coop_me",JSON.stringify(me)); }
  catch (x) { try { if (x.network) me=JSON.parse(sessionStorage.getItem("coop_me")||"null"); } catch(e){} if (!me) { if (!token) showLogin(false); return; } }
  document.body.classList.remove("auth-mode");
  const tabs = [["home","Overview",1],["about","Our solution",1],["ai","AI Insights",isTrainee()||isStaff()],["programs", "Programmes", 1], ["courses", "Learning", 1], ["attendance", "Attendance", isStaff()], ["certs", "Certificates", 1],
    ["jobs", "Jobs", 1], ["profile", "My profile", isTrainee()], ["career", "Career guide", isTrainee()], ["qr", "My QR", isTrainee()],
    ["operations", "Operations", isTrainee() || isStaff()], ["analytics", "Analytics", ["admin","institution"].includes(me.role)], ["staff", "Staff accounts", me.role === "admin"]];
  const icons={home:"⌂",about:"◎",ai:"✣",programs:"▦",courses:"▤",attendance:"◉",certs:"◇",jobs:"⌁",profile:"♙",career:"✦",qr:"▣",operations:"⚙",analytics:"◫",staff:"♚"};
  $("#nav").innerHTML = tabs.filter(t => t[2]).map(t => `<button data-v="${t[0]}"><span class="navicon">${icons[t[0]]||"•"}</span>${t[1]}</button>`).join("");
  $("#nav").hidden = false; $("#out").hidden = false;
  $("#user").textContent = me.full_name + " (" + me.role + ")";
  flushProgress();
  go("home");
}

fetch(API + "/health").then(r => r.ok ? r.json() : Promise.reject())
  .then(() => $("#api").innerHTML = '<i class="dot on"></i>Server connected')
  .catch(() => $("#api").innerHTML = '<i class="dot off"></i>Server not reachable');

if (token) start().then(() => { if (!me) showLogin(false); }); else showLogin(false);
window.addEventListener("online", flushProgress);
if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
